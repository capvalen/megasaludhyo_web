<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Centro Médico Mega Salud Huancayo - En Construcción</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #f0f4f8;
            color: #2d3748;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }
        .image-wrapper {
            margin-bottom: 24px;
        }
        .office-image {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: #1a365d;
        }
        .subtitle {
            font-size: 1.125rem;
            color: #4a5568;
            margin-bottom: 24px;
        }
        .construction-badge {
            display: inline-block;
            background: #1e3a8a;
            color: #ffffff;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.875rem;
            font-weight: 600;
        }
        .subtitle-small {
            font-size: 1rem;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="image-wrapper">
            <img src="oficina.jpg" alt="Oficina en construcción" class="office-image">
        </div>
        <h2 class="subtitle-small">Centro Médico</h2>
        <h1>Mega Salud Huancayo</h1>
        <p class="subtitle">Nuestro sitio web está en construcción</p>
        <span class="construction-badge">Pronto estaremos en línea</span>
    </div>
</body>
</html>
